name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Hetzner statt GitHub-Runner (Tom 2026-11-20: GitHub-Actions-Ausgaben nie bewilligt; Oktober 1.203,98 USD,
    # November bis 21.11. rund 1.596 USD). hetzner-org ist das org-weite Scale-Set auf unserem Cluster.
    # LANG wie auf GitHub-Runnern, das ARC-Image setzt keine Locale.
    runs-on: hetzner-org
    timeout-minutes: 15
    env:
      LANG: C.UTF-8

    strategy:
      matrix:
        node-version: [20, 22, 24, 25]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
